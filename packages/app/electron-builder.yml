appId: com.midimaker.vaultgenerator
productName: MIDI Vault Generator
directories:
  output: release
files:
  - out/**
  - package.json
  - "!**/*.map"
asarUnpack:
  # sql.js loads its wasm from disk at runtime
  - node_modules/sql.js/dist/sql-wasm.wasm
extraResources:
  # ship the pre-generated 1000-pack library; copied into the user's library
  # folder on first launch
  - from: ../../MIDI-Library
    to: MIDI-Library
    filter: ["**/*.mid", "**/metadata.json", "REPORT.md"]
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  shortcutName: MIDI Vault Generator
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.music
linux:
  target:
    - AppImage
